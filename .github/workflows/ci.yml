name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      # gopacket links libpcap via cgo; it's preinstalled on the macOS runner.
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The filtered-state harness skips itself when a kernel does not drop past
      # a full accept queue, and a plain `go test` hides that. Run it verbosely
      # so the log says whether this platform actually exercised the scenario —
      # a skip that looks like a pass is how coverage quietly disappears.
      - name: Filtered-state harness (report skip vs run)
        run: go test -run DroppedSYN -v ./internal/portscan/

      - name: Build
        run: go build -o stik-net ./cmd/stik-net
